<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2e7d32" />
    <title>FarmersChoice Agrovet — Reports</title>
    <link rel="icon" type="image/png" href="assets/OIP.webp">
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .mono { font-family: var(--font-mono); }

        .current-report-banner {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-surface); border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent); border-radius: var(--radius-sm);
            padding: 14px 18px; margin-bottom: 14px;
        }
        .current-report-banner .cr-icon { font-size: 24px; }
        .current-report-banner .cr-info { flex: 1; }
        .current-report-banner .cr-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .current-report-banner .cr-filters { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }

        .report-empty { padding: 60px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
        .report-empty .re-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.5; }
        .report-empty .re-title { font-size: 16px; color: var(--text-primary); font-weight: 600; margin-bottom: 6px; }

        .export-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

        .report-table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        table.report-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.report-table th {
            background: var(--bg-surface); text-align: left; padding: 10px 14px;
            font-family: var(--font-mono); font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.4px;
            color: var(--text-muted); border-bottom: 1px solid var(--border-color); white-space: nowrap;
        }
        table.report-table td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
        table.report-table tbody tr:hover { background: rgba(46, 125, 50, 0.04); }
        table.report-table tfoot td {
            background: var(--bg-surface); font-weight: 600;
            border-top: 2px solid var(--accent); font-family: var(--font-mono);
        }
        table.report-table .num { font-family: var(--font-mono); text-align: right; }
        table.report-table .green { color: var(--green); }
        table.report-table .red { color: var(--red); }
        table.report-table .muted { color: var(--text-muted); }

        .chart-wrap {
            background: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px;
        }
        .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); }

        .days-badge {
            display: inline-block; padding: 2px 8px;
            border-radius: 10px; font-size: 10px;
            font-weight: 600; font-family: var(--font-mono);
            white-space: nowrap;
        }
        .days-badge.overdue  { background: rgba(231, 76, 60, 0.15); color: var(--red); }
        .days-badge.today    { background: rgba(231, 76, 60, 0.25); color: var(--red); }
        .days-badge.soon     { background: rgba(243, 156, 18, 0.15); color: var(--yellow); }
        .days-badge.upcoming { background: rgba(46, 204, 113, 0.15); color: var(--green); }
        .days-badge.nodue    { background: rgba(120, 130, 150, 0.15); color: var(--text-muted); }

        .sub-section-title {
            margin: 20px 0 8px;
            font-size: 12px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
            font-family: var(--font-mono);
        }

        .source-pill {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 8px;
            font-family: var(--font-mono);
            white-space: nowrap;
        }
        .source-pill.catalog { background: rgba(155, 89, 182, 0.15); color: var(--purple); }
        .source-pill.manual  { background: rgba(52, 152, 219, 0.15); color: var(--blue); }

        /* ─── Picker modal ─── */
        #reportPickerModal .modal {
            max-width: 1180px; width: 96%; max-height: 92vh;
            display: flex; flex-direction: column; padding: 0;
        }
        #reportPickerModal .modal-header {
            padding: 16px 22px; border-bottom: 1px solid var(--border-color);
        }
        #reportPickerModal .modal-header h3 { font-size: 20px; font-weight: 500; letter-spacing: -0.2px; }
        #reportPickerModal .modal-body {
            padding: 0; display: grid;
            grid-template-columns: 1fr 380px;
            overflow: hidden; flex: 1; min-height: 0;
        }

        .picker-left { display: flex; flex-direction: column; min-height: 0; }
        .picker-search { padding: 14px 22px; border-bottom: 1px solid var(--border-color); }
        .picker-search input {
            width: 100%; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 10px 14px; color: var(--text-primary); font-size: 14px; outline: none;
        }
        .picker-list { overflow-y: auto; flex: 1; padding: 6px 0 12px; }
        .picker-group { padding: 14px 22px 6px; font-size: 13px; color: var(--text-secondary); }
        .picker-item {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 22px; cursor: pointer; font-size: 14px;
            transition: background 0.15s; border-left: 3px solid transparent;
        }
        .picker-item:hover { background: rgba(46, 125, 50, 0.06); }
        .picker-item.selected {
            background: rgba(46, 125, 50, 0.13); border-left-color: var(--accent);
            color: var(--accent); font-weight: 500;
        }
        .picker-item.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .picker-item .pi-icon { width: 20px; text-align: center; font-size: 16px; }
        .picker-item .pi-badge {
            margin-left: auto; font-size: 10px; font-family: var(--font-mono);
            padding: 2px 7px; border-radius: 8px;
            background: var(--bg-surface); color: var(--text-muted);
        }

        .picker-right {
            padding: 18px 20px 20px; overflow-y: auto;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
        }
        .picker-right h4 {
            font-size: 20px; font-weight: 400; color: var(--text-primary);
            letter-spacing: -0.2px; margin-bottom: 16px;
        }
        .filter-section-label {
            font-size: 13px; color: var(--text-secondary); margin: 12px 0 6px;
        }
        .filter-section-label:first-of-type { margin-top: 0; }
        .filter-group { margin-bottom: 10px; }
        .filter-group input,
        .filter-group select {
            width: 100%; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 2px;
            padding: 8px 10px; color: var(--text-primary);
            font-size: 14px; outline: none; height: 34px;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #4a90c2; box-shadow: 0 0 0 1px #4a90c2;
        }
        .filter-hint {
            font-size: 12px; color: var(--text-muted);
            padding: 10px 12px; background: var(--bg-primary);
            border-radius: 3px; text-align: center;
        }
        .filter-date-range {
            display: flex; align-items: center; gap: 6px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 2px; padding: 0 10px; height: 34px;
        }
        .filter-date-range .cal-icon { font-size: 14px; color: var(--text-muted); }
        .filter-date-range input {
            border: none !important; background: transparent !important;
            padding: 0 !important; height: auto !important;
            flex: 1; color: var(--text-primary);
            font-family: var(--font-mono); font-size: 13px;
        }
        .filter-date-range input:focus { box-shadow: none !important; outline: none; }

        .date-preset-row {
            display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap;
        }
        .date-preset-row button {
            flex: 1; min-width: 60px;
            padding: 6px 8px; border-radius: 3px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px; cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font-family);
        }
        .date-preset-row button:hover {
            border-color: var(--accent); color: var(--accent);
        }
        .date-preset-row button.active {
            background: rgba(46, 125, 50, 0.15);
            border-color: var(--accent); color: var(--accent);
            font-weight: 500;
        }

        .filter-actions {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-top: 18px;
        }
        .filter-actions .action-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 14px; border-radius: 2px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface); color: var(--text-primary);
            font-size: 14px; cursor: pointer; transition: all 0.15s;
            font-family: var(--font-family); height: 40px;
        }
        .filter-actions .action-btn:hover {
            background: var(--bg-card); border-color: var(--accent);
        }
        .filter-actions .action-primary {
            border-color: var(--accent);
            background: rgba(46, 125, 50, 0.08);
            color: var(--accent);
        }
        .filter-actions .action-primary:hover { background: rgba(46, 125, 50, 0.18); }

        .week-nav {
            display: flex; align-items: center; gap: 8px; margin: 8px 0 6px;
        }
        .week-nav button {
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-primary); width: 32px; height: 34px;
            border-radius: 2px; cursor: pointer; font-size: 14px;
        }
        .week-nav button:hover { border-color: var(--accent); color: var(--accent); }
        .week-nav .week-label {
            flex: 1; text-align: center;
            font-family: var(--font-mono); font-size: 13px;
            color: var(--text-secondary);
        }
        .week-hint {
            font-size: 11px; color: var(--text-muted);
            font-family: var(--font-mono); margin-top: 2px;
        }

        @media print {
            header, .navbar, .page-header button,
            .export-bar, .modal, .toast-container,
            .theme-toggle-wrapper, .user-chip,
            .current-report-banner button, .no-print { display: none !important; }
            body, .page { background: #fff !important; color: #000 !important; padding: 0 !important; }
            .current-report-banner {
                background: #f5f5f5 !important; border-color: #ccc !important;
                color: #000 !important; margin-bottom: 12px;
            }
            table.report-table th { background: #eee !important; color: #000 !important; border-color: #ccc !important; }
            table.report-table td { border-color: #ddd !important; color: #000 !important; }
            table.report-table tfoot td { background: #f0f0f0 !important; }
            .chart-wrap { page-break-inside: avoid; }
            .stat-card { background: #fff !important; border-color: #ccc !important; color: #000 !important; }
        }

        @media (max-width: 900px) {
            #reportPickerModal .modal-body { grid-template-columns: 1fr; }
            .picker-left { max-height: 40vh; }
            .picker-right { border-left: none; border-top: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="header-logo">FC</div>
            <div>
                <div class="header-title" id="appTitle">FarmersChoice Agrovet</div>
                <div class="header-sub" id="headerClock"></div>
            </div>
        </div>
        <div class="header-right">
            <div class="theme-toggle-wrapper" onclick="toggleTheme()" role="button" tabindex="0" aria-label="Toggle theme">
                <span class="toggle-icon" id="themeIcon">🌙</span>
                <div class="theme-toggle-switch"><div class="toggle-slider"></div></div>
            </div>
            <div class="user-chip" id="userChip">
                <div class="avatar" id="userAvatar">🧑‍💼</div>
                <span id="userName">User</span>
                <span style="color:var(--text-muted);font-size:11px;font-family:var(--font-mono);" id="userRole">EMPLOYEE</span>
            </div>
            <button class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <div class="navbar" id="navbar">
        <a href="pos.html" class="nav-tab">Sell</a>
        <a href="stock.html" class="nav-tab">Stock</a>
        <a href="mysales.html" class="nav-tab">My Sales</a>
        <a href="allsales.html" class="nav-tab" id="tabAll" style="display:none;">All Sales</a>
        <a href="credits.html" class="nav-tab" id="tabCredits" style="display:none;">Credits</a>
        <a href="users.html" class="nav-tab" id="tabUsers" style="display:none;">Users</a>
        <a href="reports.html" class="nav-tab active" id="tabReports" style="display:none;">Reports</a>
        <a href="live.html" class="nav-tab" id="tabLive" style="display:none;">Live</a>
        <a href="analytics.html" class="nav-tab" id="tabAnalytics" style="display:none;">Analytics</a>
    </div>

    <div class="page">
        <div class="page-header">
            <div class="page-title">Reports</div>
            <div style="display:flex;gap:8px;">
                <button class="btn-primary-solid btn-sm" onclick="openPicker()">📋 Choose Report</button>
                <button class="btn-ghost btn-sm" onclick="reloadCurrentReport()" title="Refresh">🔄</button>
            </div>
        </div>

        <div id="errorArea"></div>

        <div id="currentBanner" class="current-report-banner" style="display:none;">
            <div class="cr-icon" id="crIcon">📊</div>
            <div class="cr-info">
                <div class="cr-title" id="crTitle">Report</div>
                <div class="cr-filters" id="crFilters"></div>
            </div>
            <button class="btn-ghost btn-sm no-print" onclick="openPicker()">Change</button>
        </div>

        <div class="export-bar" id="exportBar" style="display:none;">
            <button class="btn-ghost btn-sm" onclick="doExport('csv')">⬇️ CSV</button>
            <button class="btn-ghost btn-sm" onclick="doExport('excel')">📊 Excel</button>
            <button class="btn-ghost btn-sm" onclick="window.print()">🖨️ Print / Save as PDF</button>
        </div>

        <div id="reportContent">
            <div class="report-empty">
                <div class="re-icon">📊</div>
                <div class="re-title">No report selected</div>
                <div>Click <strong>Choose Report</strong> to begin.</div>
            </div>
        </div>
    </div>

    <div class="overlay" id="reportPickerModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Select Report</h3>
                <button class="btn-ghost btn-sm" onclick="closeModal('reportPickerModal')">Close</button>
            </div>
            <div class="modal-body">
                <div class="picker-left">
                    <div class="picker-search">
                        <input type="text" id="pickerSearch" placeholder="Search reports" oninput="renderPickerList()" />
                    </div>
                    <div class="picker-list" id="pickerList"></div>
                </div>
                <div class="picker-right">
                    <h4>Filter</h4>
                    <div id="pickerFilters"></div>
                    <div class="filter-actions">
                        <button class="action-btn action-primary" onclick="confirmPicker()">
                            🔍 Show report
                        </button>
                        <button class="action-btn" onclick="confirmAndPrint()">
                            🖨️ Print
                        </button>
                        <button class="action-btn" onclick="confirmAndExport('excel')">
                            📊 Excel
                        </button>
                        <button class="action-btn" onclick="confirmAndExport('csv')">
                            📄 CSV
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/env.js"></script>
    <script src="js/shared.js"></script>

    <script>
    // ============================================
    // REPORT DEFINITIONS
    // ============================================
    const REPORTS = [
        { id: 'daily',              group: 'Sales',    icon: '📅', name: 'Daily Sales',         filters: ['date'] },
        { id: 'weekly',             group: 'Sales',    icon: '📆', name: 'Weekly Sales',        filters: ['week'] },
        { id: 'monthly',            group: 'Sales',    icon: '🗓️', name: 'Monthly Sales',       filters: ['year', 'month'] },
        { id: 'yearly',             group: 'Sales',    icon: '📊', name: 'Yearly Sales',        filters: ['year'] },
        { id: 'custom',             group: 'Sales',    icon: '📈', name: 'Custom Range Sales',  filters: ['dateRange'] },
        { id: 'payment-breakdown',  group: 'Sales',    icon: '💳', name: 'Payment Breakdown',   filters: ['dateRange', 'paymentMethod'] },

        { id: 'products-list',      group: 'Products', icon: '📦', name: 'Products List',       filters: ['category'] },
        { id: 'category-report',    group: 'Products', icon: '🏷️', name: 'Product Categories',  filters: ['dateRange'] },
        { id: 'top-products',       group: 'Products', icon: '🏆', name: 'Top Products',        filters: ['dateRange', 'limit'] },
        { id: 'stock-value',        group: 'Products', icon: '💰', name: 'Stock Value',         filters: [] },
        { id: 'stock-movement',     group: 'Products', icon: '⚡', name: 'Stock Movement',      filters: ['dateRange', 'movementFilter', 'limit'] },

        { id: 'employee-performance', group: 'People', icon: '🧑‍💼', name: 'Employee Performance', filters: ['dateRange', 'roleFilter'] },
        { id: 'users-report',         group: 'People', icon: '👥',   name: 'Users Report',         filters: [] },

        { id: 'profit-loss',        group: 'Finance', icon: '💵', name: 'Profit & Loss',      filters: ['dateRange'] },
        { id: 'price-increase-sales', group: 'Finance', icon: '💹', name: 'Price Increase Sales', filters: ['dateRange'] },
        { id: 'discount-usage',     group: 'Finance', icon: '📉', name: 'Discounts Applied',  filters: ['dateRange'] },
        { id: 'discounted-sales',   group: 'Finance', icon: '🏷️', name: 'Discounted Sales',   filters: ['dateRange'] },
        { id: 'credit',             group: 'Finance', icon: '📋', name: 'Credit Report',      filters: ['dateRange', 'creditStatus'] }
    ];

    // ============================================
    // STATE
    // ============================================
    let selectedReportId = null;
    let pendingReportId = null;
    let currentFilters = {};
    let pendingFilters = {};
    let cachedCategories = null;
    let currentChart = null;
    let lastRenderedData = null;

    const SESSION_KEY = 'fc_reports_state';

    // ============================================
    // HELPERS
    // ============================================
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    function todayISO() {
        const d = new Date(); d.setHours(0, 0, 0, 0);
        return d.toISOString().split('T')[0];
    }
    function daysAgoISO(n) {
        const d = new Date(); d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - n);
        return d.toISOString().split('T')[0];
    }
    function getReportDef(id) { return REPORTS.find(r => r.id === id); }

    function getWeekNumber(d) {
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = date.getUTCDay() || 7;
        date.setUTCDate(date.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }
    function getISOWeekYear(d) {
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = date.getUTCDay() || 7;
        date.setUTCDate(date.getUTCDate() + 4 - dayNum);
        return date.getUTCFullYear();
    }
    function getMondayOfWeek(year, week) {
        const jan4 = new Date(year, 0, 4);
        const dayOfWeek = jan4.getDay() || 7;
        const monday = new Date(jan4);
        monday.setDate(jan4.getDate() - dayOfWeek + 1 + (week - 1) * 7);
        return monday;
    }
    function weekRangeLabel(year, week) {
        const mon = getMondayOfWeek(year, week);
        const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
        const fmt = d => d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' });
        return `${fmt(mon)} → ${fmt(sun)} ${sun.getFullYear()}`;
    }
    function toISO(d) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function creditDaysUntil(dueDate) {
        if (!dueDate) return null;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate + 'T00:00:00');
        return Math.round((due - today) / 86400000);
    }
    function creditUrgency(credit) {
        const d = creditDaysUntil(credit.due_date);
        if (d === null) return 'nodue';
        if (d < 0) return 'overdue';
        if (d === 0) return 'today';
        if (d <= 7) return 'soon';
        return 'upcoming';
    }
    function creditDaysBadge(credit) {
        const d = creditDaysUntil(credit.due_date);
        if (d === null) return '<span class="days-badge nodue">No due date</span>';
        if (d < 0) return `<span class="days-badge overdue">${Math.abs(d)}d overdue</span>`;
        if (d === 0) return '<span class="days-badge today">Due today</span>';
        return `<span class="days-badge ${creditUrgency(credit)}">${d}d left</span>`;
    }

    // ============================================
    // PICKER MODAL
    // ============================================
    function openPicker() {
        pendingReportId = selectedReportId || REPORTS.find(r => !r.disabled)?.id || 'daily';
        pendingFilters = defaultFiltersFor(pendingReportId);
        renderPickerList();
        renderPickerFilters();
        openModal('reportPickerModal');
    }

    function renderPickerList() {
        const query = (document.getElementById('pickerSearch').value || '').toLowerCase().trim();
        const groups = ['Sales', 'Products', 'People', 'Finance'];
        const el = document.getElementById('pickerList');

        let html = '';
        for (const g of groups) {
            const items = REPORTS.filter(r => r.group === g && (!query || r.name.toLowerCase().includes(query)));
            if (!items.length) continue;
            html += `<div class="picker-group">${g}</div>`;
            html += items.map(r => `
                <div class="picker-item ${r.id === pendingReportId ? 'selected' : ''} ${r.disabled ? 'disabled' : ''}"
                     onclick="${r.disabled ? '' : `selectReportInPicker('${r.id}')`}">
                    <span class="pi-icon">${r.icon}</span>
                    <span>${escapeHtml(r.name)}</span>
                    ${r.badge ? `<span class="pi-badge">${r.badge}</span>` : ''}
                </div>
            `).join('');
        }
        el.innerHTML = html;
    }

    function selectReportInPicker(id) {
        const def = getReportDef(id);
        if (!def || def.disabled) return;
        pendingReportId = id;
        pendingFilters = defaultFiltersFor(id);
        renderPickerList();
        renderPickerFilters();
    }

    function defaultFiltersFor(id) {
        const def = getReportDef(id);
        if (!def) return {};
        const f = {};
        for (const t of def.filters) {
            switch (t) {
                case 'date':           f.date = todayISO(); break;
                case 'dateRange':
                    f.start_date = daysAgoISO(29);
                    f.end_date = todayISO();
                    f._preset = 'last30';
                    break;
                case 'year':           f.year = new Date().getFullYear(); break;
                case 'month':          f.month = new Date().getMonth() + 1; break;
                case 'week':
                    f.week = getWeekNumber(new Date());
                    f.year = getISOWeekYear(new Date());
                    break;
                case 'limit':          f.limit = 100; break;
                case 'category':       f.category = ''; break;
                case 'creditStatus':   f.status = 'all'; break;
                case 'paymentMethod':  f.payment_method = 'All'; break;
                case 'movementFilter': f.movement = 'all'; break;
                case 'roleFilter':     f.role = 'all'; break;
            }
        }
        return f;
    }

    function setDatePreset(preset) {
        const now = new Date();
        let start, end = todayISO();

        switch (preset) {
            case 'today':     start = todayISO(); break;
            case 'last7':     start = daysAgoISO(6); break;
            case 'last30':    start = daysAgoISO(29); break;
            case 'thisMonth': {
                const d = new Date(now.getFullYear(), now.getMonth(), 1);
                start = toISO(d);
                break;
            }
            case 'lastMonth': {
                const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const last = new Date(now.getFullYear(), now.getMonth(), 0);
                start = toISO(first);
                end = toISO(last);
                break;
            }
            case 'thisYear': {
                const d = new Date(now.getFullYear(), 0, 1);
                start = toISO(d);
                break;
            }
            default: start = daysAgoISO(29);
        }

        pendingFilters.start_date = start;
        pendingFilters.end_date = end;
        pendingFilters._preset = preset;

        document.getElementById('pf_start_date').value = start;
        document.getElementById('pf_end_date').value = end;
        updatePresetButtons();
    }

    function updatePresetButtons() {
        document.querySelectorAll('.date-preset-row button').forEach(b => {
            b.classList.toggle('active', b.dataset.preset === pendingFilters._preset);
        });
    }

                        <span style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px;">→</span>

                </div>`;

            html += `<div class="filter-section-label">Month</div>
                <div class="filter-group">

                        <option value="All" ${cur==='All'?'selected':''}>All</option>

                        <option value="M-Pesa" ${cur==='M-Pesa'?'selected':''}>M-Pesa</option>

                        <option value="Credit" ${cur==='Credit'?'selected':''}>Credit</option>

                        <option value="all" ${cur==='all'?'selected':''}>All (fast → slow)</option>

                        <option value="all" ${cur==='all'?'selected':''}>All roles</option>
                        <option value="owner" ${cur==='owner'?'selected':''}>Owner</option>
                        <option value="manager" ${cur==='manager'?'selected':''}>Manager</option>
                        <option value="employee" ${cur==='employee'?'selected':''}>Employee</option>
                    </select>
                </div>`;

                        <option value="all" ${cur==='all'?'selected':''}>All (incl. paid)</option>

    function weekShift(delta) {
        const anchor = document.getElementById('pf_week_anchor');
        if (!anchor) return;
        const cur = new Date(anchor.value + 'T00:00:00');
        cur.setDate(cur.getDate() + delta * 7);
        anchor.value = toISO(cur);
        onWeekAnchorChange();
    }
    function onWeekAnchorChange() {
        const anchor = document.getElementById('pf_week_anchor');
        if (!anchor) return;
        const d = new Date(anchor.value + 'T00:00:00');
        pendingFilters.week = getWeekNumber(d);
        pendingFilters.year = getISOWeekYear(d);
        const hint = document.getElementById('pf_week_hint');
        if (hint) hint.textContent = weekRangeLabel(pendingFilters.year, pendingFilters.week);
        const label = document.querySelector('.week-label');
        if (label) label.textContent = `W${pendingFilters.week} · ${pendingFilters.year}`;
    }

    async function populateCategoryDropdown() {
        const sel = document.getElementById('pf_category');
        if (!sel) return;
        if (!cachedCategories) {
            try { cachedCategories = await fetchCategories(); }
            catch { cachedCategories = []; }
        }
        const sorted = [...cachedCategories].sort((a, b) => a.name.localeCompare(b.name));
        sel.innerHTML = '<option value="">All products</option>' +
            sorted.map(c => `<option value="${c.id}" ${pendingFilters.category === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
    }

    function readPendingFiltersFromForm() {
        const def = getReportDef(pendingReportId);
        if (!def) return {};
        const f = {};
        for (const t of def.filters) {
            switch (t) {
                case 'date': {
                    const v = document.getElementById('pf_date')?.value;
                    if (v) f.date = v;
                    break;
                }
                case 'dateRange': {
                    const s = document.getElementById('pf_start_date')?.value;
                    const e = document.getElementById('pf_end_date')?.value;
                    if (s) f.start_date = s;
                    if (e) f.end_date = e;
                    f._preset = pendingFilters._preset || 'custom';
                    break;
                }
                case 'year': {
                    if (def.filters.includes('week')) {
                        f.year = pendingFilters.year || new Date().getFullYear();
                    } else {
                        const v = document.getElementById('pf_year')?.value;
                        if (v) f.year = parseInt(v);
                    }
                    break;
                }
                case 'month': {
                    const v = document.getElementById('pf_month')?.value;
                    if (v) f.month = parseInt(v);
                    break;
                }
                case 'week': {
                    f.week = pendingFilters.week || getWeekNumber(new Date());
                    f.year = pendingFilters.year || getISOWeekYear(new Date());
                    break;
                }
                case 'limit': {
                    const v = document.getElementById('pf_limit')?.value;
                    if (v) f.limit = parseInt(v);
                    break;
                }
                case 'category': {
                    const v = document.getElementById('pf_category')?.value;
                    f.category = v || '';
                    break;
                }
                case 'creditStatus': {
                    const v = document.getElementById('pf_status')?.value;
                    if (v) f.status = v;
                    break;
                }
                case 'paymentMethod': {
                    const v = document.getElementById('pf_payment_method')?.value;
                    f.payment_method = v || 'All';
                    break;
                }
                case 'movementFilter': {
                    const v = document.getElementById('pf_movement')?.value;
                    f.movement = v || 'all';
                    break;
                }
                case 'roleFilter': {
                    const v = document.getElementById('pf_role')?.value;
                    f.role = v || 'all';
                    break;
                }
            }
        }
        return f;
    }

    function confirmPicker() {
        pendingFilters = readPendingFiltersFromForm();
        selectedReportId = pendingReportId;
        currentFilters = { ...pendingFilters };
        closeModal('reportPickerModal');
        saveState();
        loadCurrentReport();
    }

    function saveState() {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ selectedReportId, currentFilters }));
    }

    function restoreState() {
        try {
            const raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return false;
            const s = JSON.parse(raw);
            if (s && s.selectedReportId && getReportDef(s.selectedReportId)) {
                selectedReportId = s.selectedReportId;
                const stored = s.currentFilters || {};
                const def = getReportDef(s.selectedReportId);
                const needed = def.filters || [];
                const hasDateRange = needed.includes('dateRange');
                const hasSingleDate = needed.includes('date');
                const staleForRange = hasDateRange && (!stored.start_date || !stored.end_date);
                const staleForSingle = hasSingleDate && !stored.date;
                currentFilters = (staleForRange || staleForSingle)
                    ? defaultFiltersFor(s.selectedReportId)
                    : stored;
                return true;
            }
        } catch { /* */ }
        return false;
    }

    function reloadCurrentReport() {
        if (!selectedReportId) { openPicker(); return; }
        loadCurrentReport();
    }

    // ============================================
    // LOAD & RENDER
    // ============================================
    async function loadCurrentReport() {
        if (!selectedReportId) return;
        const def = getReportDef(selectedReportId);
        if (!def || def.disabled) return;

        updateBanner();
        document.getElementById('exportBar').style.display = 'flex';

        const container = document.getElementById('reportContent');
        container.innerHTML = '<div class="report-empty">⏳ Loading...</div>';
        const errorArea = document.getElementById('errorArea');
        errorArea.innerHTML = '';

        try {
            const data = await fetchReportFor(selectedReportId, currentFilters);
            lastRenderedData = data;
            renderReport(selectedReportId, data, currentFilters);
        } catch (err) {
            console.error('loadCurrentReport failed:', err);
            container.innerHTML = '';
            errorArea.innerHTML = `
                <div class="error-banner">
                    <div>
                        <strong>Could not load report.</strong><br>
                        <span style="font-size:13px;">${escapeHtml(err.message || 'Unknown error')}</span>
                    </div>
                    <button class="btn-ghost btn-sm" onclick="loadCurrentReport()">Retry</button>
                </div>`;
            showToast('Failed to load report', 'error');
        }
    }

    async function fetchReportFor(id, filters) {
        if (id === 'products-list') return await fetchProducts();

        if (id === 'users-report') {
            const users = await fetchUsers();
            return { users: users || [] };
        }

        // ─── Price Increase Sales ───
        if (id === 'price-increase-sales') {
            const params = {};
            if (filters.start_date) params.start_date = filters.start_date + 'T00:00:00';
            if (filters.end_date)   params.end_date   = filters.end_date + 'T23:59:59';
            const report = await fetchReport('custom', params);
            const allSales = report?.sales || [];

            let productsById = {};
            try {
                const allProducts = await fetchProducts();
                (allProducts || []).forEach(p => {
                    const inv = Array.isArray(p.inventory) && p.inventory.length ? p.inventory[0] : null;
                    const productPrice = Number(p.selling_price) || 0;
                    const invPrice = Number(inv?.selling_price) || 0;
                    productsById[p.id] = {
                        name: p.name,
                        selling_price: Math.max(productPrice, invPrice)
                    };
                });
            } catch (e) {
                console.warn('Could not fetch products for price-increase-sales:', e);
            }

            const increased = [];
            allSales.forEach(s => {
                const items = s.sale_items || [];
                let increaseTotal = 0;
                const itemDetails = [];

                items.forEach(it => {
                    const base = productsById[it.product_id]?.selling_price;
                    const unit = Number(it.unit_price) || 0;
                    const qty = Number(it.quantity) || 0;
                    if (base !== undefined && unit > base) {
                        const inc = (unit - base) * qty;
                        increaseTotal += inc;
                        itemDetails.push({
                            product_name: it.product_name || productsById[it.product_id]?.name || '—',
                            quantity: qty,
                            base_price: base,
                            unit_price: unit,
                            increase_per_unit: unit - base,
                            increase_total: inc
                        });
                    }
                });

                if (increaseTotal > 0) {
                    increased.push({
                        receipt_number: s.receipt_number,
                        sale_date: s.sale_date,
                        customer_name: s.customer_name || 'Walk-in',
                        cashier_name: s.user?.full_name || '—',
                        payment_method: s.payment_method || '',
                        subtotal: Number(s.subtotal) || 0,
                        total: Number(s.total) || 0,
                        increase_total: increaseTotal,
                        items: itemDetails
                    });
                }
            });

            return {
                date_range: report.date_range,
                all_sales: allSales,
                increased
            };
        }

        // ─── Unified Discounts Applied: catalog + manual ───
        if (id === 'discount-usage') {
            const startISO = filters.start_date ? filters.start_date + 'T00:00:00' : null;
            const endISO   = filters.end_date   ? filters.end_date + 'T23:59:59'   : null;

            const usageParams = new URLSearchParams();
            if (filters.start_date) usageParams.set('start_date', filters.start_date);
            if (filters.end_date)   usageParams.set('end_date',   filters.end_date);
            const usageRes = await apiRequest('/discounts/usage-report?' + usageParams.toString());
            const usages = (usageRes.data?.usage_details) || [];

            const salesParams = {};
            if (startISO) salesParams.start_date = startISO;
            if (endISO)   salesParams.end_date   = endISO;
            const customReport = await fetchReport('custom', salesParams);
            const manualSales = (customReport?.sales || []).filter(s => (Number(s.discount) || 0) > 0);

            const catalogRows = usages.map(u => ({
                date: u.applied_at,
                receipt: u.sale?.receipt_number || '—',
                customer: u.sale?.customer_name || 'Walk-in',
                source: 'catalog',
                source_label: u.discount?.name || 'Catalog discount',
                amount: Number(u.discount_amount) || 0
            }));

            const catalogReceipts = new Set(catalogRows.map(r => r.receipt));
            const manualRows = manualSales
                .filter(s => !catalogReceipts.has(s.receipt_number))
                .map(s => ({
                    date: s.sale_date,
                    receipt: s.receipt_number || '—',
                    customer: s.customer_name || 'Walk-in',
                    source: 'manual',
                    source_label: 'Manual discount',
                    amount: Number(s.discount) || 0
                }));

            const merged = [...catalogRows, ...manualRows].sort(
                (a, b) => new Date(b.date) - new Date(a.date)
            );

            return {
                catalog_count: catalogRows.length,
                manual_count: manualRows.length,
                total_count: merged.length,
                total_amount: merged.reduce((s, r) => s + r.amount, 0),
                merged
            };
        }

        if (id === 'discounted-sales') {
            const params = {};
            if (filters.start_date) params.start_date = filters.start_date + 'T00:00:00';
            if (filters.end_date)   params.end_date   = filters.end_date + 'T23:59:59';
            const report = await fetchReport('custom', params);
            const allSales = report?.sales || [];
            return {
                date_range: report.date_range,
                all_sales: allSales,
                discounted: allSales.filter(s => (Number(s.discount) || 0) > 0)
            };
        }

        if (id === 'credit') {
            const params = new URLSearchParams();
            if (filters.start_date) params.set('start_date', filters.start_date + 'T00:00:00');
            if (filters.end_date)   params.set('end_date',   filters.end_date + 'T23:59:59');
            params.set('status', filters.status || 'all');
            params.set('limit', '500');
            const res = await apiRequest('/discounts/credit?' + params.toString());
            return res;
        }

        if (id === 'payment-breakdown') {
            const params = {};
            if (filters.start_date) params.start_date = filters.start_date;
            if (filters.end_date) params.end_date = filters.end_date;
            if (filters.payment_method && filters.payment_method !== 'All') {
                params.payment_method = filters.payment_method;
            }
            return await fetchReport('payment-breakdown-v2', params);
        }

        if (id === 'stock-movement') {
            const params = {};
            if (filters.start_date) params.start_date = filters.start_date;
            if (filters.end_date) params.end_date = filters.end_date;
            if (filters.limit) params.limit = filters.limit;
            return await fetchReport('stock-movement-v2', params);
        }

        return await fetchReport(id, filters);
    }

    function updateBanner() {
        const def = getReportDef(selectedReportId);
        if (!def) return;
        document.getElementById('currentBanner').style.display = 'flex';
        document.getElementById('crIcon').textContent = def.icon;
        document.getElementById('crTitle').textContent = def.name;
        document.getElementById('crFilters').textContent = formatFiltersLine(currentFilters);
    }

    function formatFiltersLine(f) {
        const parts = [];
        if (f.date) parts.push(`Date: ${f.date}`);
        if (f.start_date && f.end_date) parts.push(`${f.start_date} → ${f.end_date}`);
        if (f.year && f.week) parts.push(`Week ${f.week}, ${f.year}`);
        else if (f.year) parts.push(`Year: ${f.year}`);
        if (f.month) parts.push(`Month: ${f.month}`);
        if (f.limit && !f.week) parts.push(`Limit: ${f.limit}`);
        if (f.status) parts.push(`Status: ${f.status}`);
        if (f.payment_method && f.payment_method !== 'All') parts.push(f.payment_method);
        if (f.movement && f.movement !== 'all') parts.push(`${f.movement} moving`);
        if (f.role && f.role !== 'all') parts.push(`Role: ${f.role}`);
        if (f.category) parts.push('Filtered by category');
        return parts.join(' · ') || 'No filters';
    }

    // ============================================
    // RENDERERS
    // ============================================
    function renderReport(id, data, filters) {
        const c = document.getElementById('reportContent');
        try {
            switch (id) {
                case 'daily':
                case 'weekly':
                case 'monthly':
                case 'yearly':
                case 'custom':              return renderDailyOrRange(c, data);
                case 'payment-breakdown':   return renderPaymentBreakdown(c, data);
                case 'products-list':       return renderProductsList(c, data, filters);
                case 'category-report':     return renderCategoryReport(c, data);
                case 'top-products':        return renderTopProducts(c, data);
                case 'stock-value':         return renderStockValue(c, data);
                case 'stock-movement':      return renderStockMovement(c, data, filters);
                case 'employee-performance':return renderEmployeePerformance(c, data, filters);
                case 'users-report':        return renderUsersReport(c, data);
                case 'profit-loss':         return renderProfitLoss(c, data);
                case 'price-increase-sales':return renderPriceIncreaseSales(c, data);
                case 'discount-usage':      return renderDiscountUsage(c, data);
                case 'discounted-sales':    return renderDiscountedSales(c, data);
                case 'credit':              return renderCredit(c, data, filters);
                default: c.innerHTML = '<div class="report-empty">No renderer for this report.</div>';
            }
        } catch (err) {
            console.error('renderReport error:', err);
            c.innerHTML = `<div class="error-banner"><div><strong>Render error.</strong><br>${escapeHtml(err.message)}</div></div>`;
        }
    }

    function destroyChart() {
        if (currentChart) { currentChart.destroy(); currentChart = null; }
    }

    function renderDailyOrRange(container, data) {
        destroyChart();
        const s = data.summary || {};
        const kpis = [

        destroyChart();

            const inv = Array.isArray(p.inventory) && p.inventory.length ? p.inventory[0] : null;
            const stock = p.total_stock ?? inv?.current_stock ?? p.quantity ?? 0;
            const cost = inv?.cost_price ?? p.cost_price ?? 0;
            const sell = inv?.selling_price ?? p.selling_price ?? 0;
            return {
                id: p.id, sku: p.sku || '', name: p.name,
                category_id: p.category_id || '',
                category: p.categories?.name || 'Uncategorized',
                unit: p.unit_of_measure || 'piece',
                stock, cost, sell,
                cost_value: stock * cost,
                sale_value: stock * sell,
                margin: stock * (sell - cost)

    function renderStockMovement(container, payload, filters) {
        destroyChart();
        const summary = payload.summary || {};
        let rows = payload.data || [];
        const movementFilter = filters.movement || 'all';

        if (movementFilter === 'fast') {
            const threshold = Math.max(1, Math.round(
                rows.reduce((s, r) => s + r.total_quantity_sold, 0) / Math.max(rows.length, 1)
            ));
            rows = rows.filter(r => r.total_quantity_sold >= threshold);
        } else if (movementFilter === 'slow') {
            const threshold = Math.max(1, Math.round(
                rows.reduce((s, r) => s + r.total_quantity_sold, 0) / Math.max(rows.length, 1)
            ));
            rows = rows.filter(r => r.total_quantity_sold > 0 && r.total_quantity_sold < threshold);
        } else if (movementFilter === 'stalled') {
            rows = rows.filter(r => r.total_quantity_sold === 0);
        }

        const kpis = [
            ['Products', summary.total_products || rows.length, 'var(--accent)'],
            ['With Movement', summary.total_products_moved || 0, 'var(--text)'],
            ['Stalled', summary.total_products_stalled || 0, 'var(--red)'],
            ['Units Sold', summary.total_units_sold || 0, 'var(--text)'],
            ['Revenue', formatCurrency(summary.total_revenue || 0), 'var(--green)']
        ];

        let html = `<div class="stats-grid">${createStats(kpis)}</div>`;
        if (rows.length) {
            html += `<div class="chart-wrap no-print">
                <div class="chart-title">Movement — fast → slow (units sold)</div>
                <canvas id="reportChart" height="140"></canvas>
            </div>`;
        }

        const totalQty = rows.reduce((s, r) => s + r.total_quantity_sold, 0);
        const totalRev = rows.reduce((s, r) => s + r.total_revenue, 0);
        const totalProfit = rows.reduce((s, r) => s + r.total_profit, 0);
        const totalStock = rows.reduce((s, r) => s + r.current_stock, 0);

        html += `
            <div class="report-table-wrap">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>#</th><th>SKU</th><th>Product</th>
                            <th>Category</th>
                            <th class="num">Units Sold</th>
                            <th class="num">Avg/Day</th>
                            <th class="num">Stock</th>

                            <th class="num">Profit</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map((r, idx) => {
                            const rowStyle = r.total_quantity_sold === 0 ? 'style="opacity:0.6;"' : '';
                            return `
                            <tr ${rowStyle}>
                                <td class="mono">${idx + 1}</td>
                                <td class="mono">${escapeHtml(r.sku || '—')}</td>
                                <td>${escapeHtml(r.product_name || '')}</td>
                                <td class="muted">${escapeHtml(r.category_name || '')}</td>
                                <td class="num"><strong>${r.total_quantity_sold || 0}</strong></td>
                                <td class="num">${r.avg_daily_units ?? '—'}</td>
                                <td class="num">${r.current_stock ?? 0}</td>
                                <td class="num">${r.days_of_stock_left === null ? '∞' : (r.days_of_stock_left ?? '—')}</td>
                                <td class="num green">${formatCurrency(r.total_revenue || 0)}</td>

                        }).join('')}

                    <tfoot>
                        <tr>
                            <td colspan="4">GRAND TOTAL</td>

                            <td colspan="2"></td>

    // ── Users Report ──
    function renderUsersReport(container, data) {
        destroyChart();
        const users = data.users || [];

        const total = users.length;
        const active = users.filter(u => u.is_active !== false).length;
        const owners = users.filter(u => u.role === 'owner').length;
        const managers = users.filter(u => u.role === 'manager').length;
        const employees = users.filter(u => u.role === 'employee').length;

        const kpis = [
            ['Total Users', total, 'var(--accent)'],
            ['Active', active, 'var(--green)'],
            ['Owners', owners, 'var(--yellow)'],
            ['Managers', managers, 'var(--blue)'],
            ['Employees', employees, 'var(--green)']
        ];

        let html = `<div class="stats-grid">${createStats(kpis)}</div>`;

        if (!users.length) {
            html += '<div class="report-empty">No users found.</div>';
            container.innerHTML = html;
            return;
        }

        const order = { owner: 0, manager: 1, employee: 2 };
        const sorted = users.slice().sort((a, b) => {
            const ao = order[a.role] ?? 3;
            const bo = order[b.role] ?? 3;
            if (ao !== bo) return ao - bo;
            return (a.full_name || '').localeCompare(b.full_name || '');

        const permsLabel = (u) => {

            if (perms.includes('all')) return '<span style="color:var(--yellow);font-weight:600;">ALL</span>';
            if (perms.length === 0) return '<span class="muted">None</span>';
            return `<span class="mono" style="font-size:11px;">${perms.length} granted</span>`;
        };

        html += `
            <div class="report-table-wrap">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>

                                <td class="mono" style="font-size:12px;">${escapeHtml(u.email || '—')}</td>

                                <td>
                                    <span class="pill ${getRolePillClass(u.role)}">

    // ── Frontend CSV/Excel export for reports the backend can't handle ──
    function buildPriceIncreaseCSV() {
        const data = lastRenderedData;
        if (!data || !Array.isArray(data.increased)) return null;

        const esc = v => {
            const s = String(v ?? '');
            if (s.includes(',') || s.includes('"') || s.includes('\n')) {
                return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        };

        const meta = [];
        meta.push(['FarmersChoice Agrovet — Price Increase Sales']);
        if (data.date_range) {
            meta.push([`Period: ${data.date_range.start_date || ''} → ${data.date_range.end_date || ''}`]);
        }
        meta.push([`Generated: ${new Date().toLocaleString('en-KE')}`]);
        meta.push([]);

        meta.push(['SALE-LEVEL SUMMARY']);
        meta.push(['Receipt', 'Date', 'Customer', 'Cashier', 'Payment', 'Subtotal', 'Increase', 'Total']);
        (data.increased || []).forEach(s => {
            meta.push([
                s.receipt_number,
                new Date(s.sale_date).toLocaleString('en-KE'),
                s.customer_name || 'Walk-in',
                s.cashier_name || '—',
                s.payment_method || '',
                s.subtotal || 0,
                s.increase_total || 0,
                s.total || 0
            ]);
        });
        const totalSub = data.increased.reduce((a, s) => a + (Number(s.subtotal) || 0), 0);
        const totalInc = data.increased.reduce((a, s) => a + (Number(s.increase_total) || 0), 0);
        const totalRev = data.increased.reduce((a, s) => a + (Number(s.total) || 0), 0);
        meta.push(['GRAND TOTAL', '', '', '', '', totalSub, totalInc, totalRev]);

        meta.push([]);
        meta.push(['ITEM-LEVEL DETAIL']);
        meta.push(['Receipt', 'Product', 'Qty', 'Base Price', 'Charged Price', 'Increase/Unit', 'Increase Total']);
        data.increased.forEach(s => {
            (s.items || []).forEach(it => {
                meta.push([
                    s.receipt_number,
                    it.product_name,
                    it.quantity,
                    it.base_price,
                    it.unit_price,
                    it.increase_per_unit,
                    it.increase_total
                ]);
            });
        });

        return meta.map(r => r.map(esc).join(',')).join('\n');
    }

    function buildPriceIncreaseExcel() {
        const data = lastRenderedData;
        if (!data || !Array.isArray(data.increased)) return null;

        const e = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

        let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>`;
        html += `<h2>FarmersChoice Agrovet — Price Increase Sales</h2>`;
        if (data.date_range) {
            html += `<p><strong>Period:</strong> ${e(data.date_range.start_date || '')} → ${e(data.date_range.end_date || '')}</p>`;
        }
        html += `<p><strong>Generated:</strong> ${e(new Date().toLocaleString('en-KE'))}</p>`;

        html += `<h3>Sale-Level Summary</h3>`;
        html += `<table border="1" cellspacing="0" cellpadding="4">`;
        html += `<tr style="background:#eee;font-weight:bold">
                    <th>Receipt</th><th>Date</th><th>Customer</th><th>Cashier</th>
                    <th>Payment</th><th>Subtotal</th><th>Increase</th><th>Total</th>
                 </tr>`;
        data.increased.forEach(s => {
            html += `<tr>
                <td>${e(s.receipt_number)}</td>
                <td>${e(new Date(s.sale_date).toLocaleString('en-KE'))}</td>
                <td>${e(s.customer_name || 'Walk-in')}</td>
                <td>${e(s.cashier_name || '—')}</td>
                <td>${e(s.payment_method || '')}</td>
                <td align="right">${Number(s.subtotal) || 0}</td>
                <td align="right">${Number(s.increase_total) || 0}</td>
                <td align="right">${Number(s.total) || 0}</td>
            </tr>`;
        });
        const totalSub = data.increased.reduce((a, s) => a + (Number(s.subtotal) || 0), 0);
        const totalInc = data.increased.reduce((a, s) => a + (Number(s.increase_total) || 0), 0);
        const totalRev = data.increased.reduce((a, s) => a + (Number(s.total) || 0), 0);
        html += `<tr style="background:#f0f0f0;font-weight:bold">
                    <td colspan="5">GRAND TOTAL</td>
                    <td align="right">${totalSub}</td>
                    <td align="right">${totalInc}</td>
                    <td align="right">${totalRev}</td>
                 </tr>`;
        html += `</table>`;

        html += `<h3>Item-Level Detail</h3>`;
        html += `<table border="1" cellspacing="0" cellpadding="4">`;
        html += `<tr style="background:#eee;font-weight:bold">
                    <th>Receipt</th><th>Product</th><th>Qty</th><th>Base Price</th>
                    <th>Charged Price</th><th>Increase/Unit</th><th>Increase Total</th>
                 </tr>`;
        data.increased.forEach(s => {
            (s.items || []).forEach(it => {
                html += `<tr>
                    <td>${e(s.receipt_number)}</td>
                    <td>${e(it.product_name)}</td>
                    <td align="right">${it.quantity}</td>
                    <td align="right">${it.base_price}</td>
                    <td align="right">${it.unit_price}</td>
                    <td align="right">${it.increase_per_unit}</td>
                    <td align="right">${it.increase_total}</td>
                </tr>`;
            });
        });
        html += `</table>`;

        const byStaff = {};
        data.increased.forEach(s => {
            const k = s.cashier_name || '—';
            if (!byStaff[k]) byStaff[k] = { count: 0, inc: 0, rev: 0 };
            byStaff[k].count++;
            byStaff[k].inc += Number(s.increase_total) || 0;
            byStaff[k].rev += Number(s.total) || 0;
        });
        html += `<h3>Breakdown by Employee</h3>`;
        html += `<table border="1" cellspacing="0" cellpadding="4">`;
        html += `<tr style="background:#eee;font-weight:bold">
                    <th>Employee</th><th>Sales</th><th>Total Increase</th><th>Revenue</th>
                 </tr>`;
        Object.entries(byStaff).forEach(([name, v]) => {
            html += `<tr>
                <td>${e(name)}</td>
                <td align="right">${v.count}</td>
                <td align="right">${v.inc}</td>
                <td align="right">${v.rev}</td>
            </tr>`;
        });
        html += `</table>`;

        html += `</body></html>`;
        return html;
    }

    function downloadTextBlob(text, filename, mime = 'text/plain;charset=utf-8') {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /**
     * Translate the current report filters into a date range that the
     * backend's /exports/report endpoint understands.
     */
    function buildExportFilters(reportId, f) {
        const out = {};

        if (f.status) out.status = f.status;
        if (f.payment_method && f.payment_method !== 'All') out.payment_method = f.payment_method;
        if (f.movement && f.movement !== 'all') out.movement = f.movement;
        if (f.role && f.role !== 'all') out.role = f.role;
        if (f.category) out.category = f.category;
        if (f.limit && reportId === 'stock-movement') out.limit = f.limit;

        if (f.start_date && f.end_date) {
            out.start_date = f.start_date;
            out.end_date = f.end_date;
        } else if (f.date) {
            out.start_date = f.date;
            out.end_date = f.date;
        } else if (f.year && f.month) {
            const y = f.year, m = f.month;
            const first = new Date(y, m - 1, 1);
            const last = new Date(y, m, 0);
            out.start_date = toISO(first);
            out.end_date = toISO(last);
        } else if (f.year && f.week) {
            const mon = getMondayOfWeek(f.year, f.week);
            const sun = new Date(mon);
            sun.setDate(mon.getDate() + 6);
            out.start_date = toISO(mon);
            out.end_date = toISO(sun);
        } else if (f.year) {
            const first = new Date(f.year, 0, 1);
            const last = new Date(f.year, 11, 31);
            out.start_date = toISO(first);
            out.end_date = toISO(last);
        }

        return out;
    }

    async function doExport(format) {
        if (!selectedReportId) { showToast('No report selected', 'warning'); return; }

        console.log('📤 Export:', selectedReportId, '→', format, 'filters:', currentFilters);

        // ── Price Increase Sales: client-side CSV/Excel ──
        if (selectedReportId === 'price-increase-sales') {
            if (!lastRenderedData) {
                showToast('Load the report first', 'warning');
                return;
            }
            const stamp = new Date().toISOString().slice(0, 10);
            if (format === 'csv') {
                const csv = buildPriceIncreaseCSV();
                if (!csv) { showToast('Nothing to export', 'warning'); return; }
                downloadTextBlob(csv, `Price_Increase_Sales_${stamp}.csv`, 'text/csv;charset=utf-8');
                showToast('CSV downloaded', 'success');
                return;
            }
            if (format === 'excel') {
                const xls = buildPriceIncreaseExcel();
                if (!xls) { showToast('Nothing to export', 'warning'); return; }
                downloadTextBlob(xls, `Price_Increase_Sales_${stamp}.xls`, 'application/vnd.ms-excel');
                showToast('Excel downloaded', 'success');
                return;
            }
            showToast('Use Print / Save as PDF for this report', 'info');
            return;
        }

        // ── All other reports: normalize filters → date range, then call backend ──
        const filters = buildExportFilters(selectedReportId, currentFilters);

        try {
            showToast(`Preparing ${format.toUpperCase()}...`, 'info');
            const filename = await exportReport(selectedReportId, filters, format);
            showToast(`Downloaded: ${filename}`, 'success');
        } catch (err) {
            console.error('export failed:', err);
            showToast('Export failed: ' + err.message, 'error');
        }
    }

    // ============================================
    // INIT
    // ============================================
    async function init() {
        if (!requireAuth()) return;
        await refreshCurrentUser();

        if (!hasPerm('reports.view')) {
            showToast('Access denied — you do not have reports permission', 'error');
            setTimeout(() => window.location.href = 'pos.html', 800);
            return;
        }

        if (window.CONFIG?.APP?.NAME) {
            const t = document.getElementById('appTitle');
            if (t) t.textContent = CONFIG.APP.NAME;
        }

        document.getElementById('tabAll').style.display       = hasPerm('sales.view_all')  ? '' : 'none';
        document.getElementById('tabCredits').style.display   = hasPerm('sales.view_all')  ? '' : 'none';
        document.getElementById('tabReports').style.display   = hasPerm('reports.view')    ? '' : 'none';
        document.getElementById('tabLive').style.display      = hasPerm('live.view')       ? '' : 'none';
        document.getElementById('tabAnalytics').style.display = hasPerm('analytics.view')  ? '' : 'none';
        document.getElementById('tabUsers').style.display     = hasPerm('users.view')      ? '' : 'none';

        updateUserChip();

        if (restoreState() && selectedReportId) {
            loadCurrentReport();
        }

        console.log('✅ Reports page ready');
    }

    document.addEventListener('DOMContentLoaded', init);
