<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2e7d32" />
    <title>FarmersChoice Agrovet — Credit Control</title>
    <link rel="icon" type="image/png" href="assets/OIP.webp">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .mono { font-family: var(--font-mono); }

        .loading-spinner {
            display: flex; justify-content: center; align-items: center;
            padding: 30px; color: var(--text-muted); font-size: 14px;
        }
        .loading-spinner::before {
            content: '';
            width: 24px; height: 24px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-banner {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #f87171;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 10px 0;
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px;
        }

        .empty-state {
            padding: 40px 16px; text-align: center;
            color: var(--text-muted); font-size: 14px;
        }

        .filters-bar {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 12px; align-items: center;
        }
        .filters-bar .search-input { flex: 1; min-width: 220px; }
        .filters-bar select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 8px 12px; font-size: 14px;
            min-width: 160px; outline: none;
        }

        .credit-row {
            cursor: pointer;
            transition: background 0.15s;
        }
        .credit-row:hover { background: rgba(46, 125, 50, 0.04); }

        .credit-row.overdue td:first-child { border-left: 4px solid var(--red); }
        .credit-row.soon td:first-child { border-left: 4px solid var(--yellow); }
        .credit-row.upcoming td:first-child { border-left: 4px solid var(--green); }
        .credit-row.nodue td:first-child { border-left: 4px solid var(--text-muted); }

        .days-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-mono);
            white-space: nowrap;
        }
        .days-badge.overdue { background: rgba(231, 76, 60, 0.15); color: var(--red); }
        .days-badge.soon { background: rgba(243, 156, 18, 0.15); color: var(--yellow); }
        .days-badge.upcoming { background: rgba(46, 204, 113, 0.15); color: var(--green); }
        .days-badge.today { background: rgba(231, 76, 60, 0.25); color: var(--red); }
        .days-badge.paid { background: rgba(120, 130, 150, 0.15); color: var(--text-muted); }

        /* Detail panel */
        .credit-detail-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            z-index: 210;
            display: none;
            justify-content: flex-end;
        }
        .credit-detail-overlay.open { display: flex; }

        .credit-detail-panel {
            width: 100%;
            max-width: 520px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: none; opacity: 1; }
        }

        .cdp-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cdp-header h3 { flex: 1; font-size: 17px; }
        .cdp-header .close-x {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
        }
        .cdp-header .close-x:hover { border-color: var(--accent); color: var(--accent); }

        .cdp-body {
            flex: 1; overflow-y: auto;
            padding: 18px 22px;
        }

        .cdp-section {
            margin-bottom: 20px;
        }
        .cdp-section-label {
            font-size: 11px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .cdp-kv {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        .cdp-kv.total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 6px;
            font-weight: 600;
            font-size: 15px;
        }
        .cdp-kv .v { font-family: var(--font-mono); }
        .cdp-kv .v.red { color: var(--red); }
        .cdp-kv .v.green { color: var(--green); }
        .cdp-kv .v.yellow { color: var(--yellow); }

        .payment-history-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .payment-history-item .phi-info { font-size: 12px; }
        .payment-history-item .phi-date {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 11px;
        }
        .payment-history-item .phi-amount {
            font-family: var(--font-mono);
            color: var(--green);
            font-weight: 600;
        }

        .cdp-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-surface);
            display: flex;
            gap: 8px;
        }
        .cdp-footer button { flex: 1; justify-content: center; }

        /* Payment form fields */
        .payment-methods-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }
        .payment-mini-btn {
            padding: 8px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            font-family: var(--font-family);
            transition: all 0.15s;
        }
        .payment-mini-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(46, 125, 50, 0.08);
        }

        @media (max-width: 768px) {
            .credit-detail-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="header-logo">FC</div>
            <div>
                <div class="header-title" id="appTitle">FarmersChoice Agrovet</div>
                <div class="header-sub" id="headerClock"></div>
            </div>
        </div>
        <div class="header-right">
            <div class="theme-toggle-wrapper" onclick="toggleTheme()" role="button" tabindex="0">
                <span class="toggle-icon" id="themeIcon">🌙</span>
                <div class="theme-toggle-switch"><div class="toggle-slider"></div></div>
            </div>
            <div class="user-chip" id="userChip">
                <div class="avatar" id="userAvatar">🧑‍💼</div>
                <span id="userName">User</span>
                <span style="color:var(--text-muted);font-size:11px;font-family:var(--font-mono);" id="userRole">EMPLOYEE</span>
            </div>
            <button class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <!-- NAV -->
    <div class="navbar" id="navbar">
        <a href="pos.html" class="nav-tab">Sell</a>
        <a href="stock.html" class="nav-tab">Stock</a>
        <a href="mysales.html" class="nav-tab">My Sales</a>
        <a href="allsales.html" class="nav-tab" id="tabAll" style="display:none;">All Sales</a>
        <a href="credits.html" class="nav-tab active" id="tabCredits" style="display:none;">Credits</a>
        <a href="users.html" class="nav-tab" id="tabUsers" style="display:none;">Users</a>
        <a href="reports.html" class="nav-tab" id="tabReports" style="display:none;">Reports</a>
        <a href="live.html" class="nav-tab" id="tabLive" style="display:none;">Live</a>
        <a href="analytics.html" class="nav-tab" id="tabAnalytics" style="display:none;">Analytics</a>
    </div>

    <!-- PAGE -->
    <div class="page">
        <div class="page-header">
            <div class="page-title">Credit Control</div>
            <div style="display:flex;gap:8px;">
                <button class="btn-ghost btn-sm" onclick="loadCredits()" title="Refresh">🔄 Refresh</button>
            </div>
        </div>

        <div id="errorArea"></div>
        <div class="stats-grid" id="creditStats"></div>

        <div class="filters-bar">
            <input type="text" id="creditSearch" class="search-input" placeholder="Search by customer name or phone..." oninput="renderCredits()" autocomplete="off" />
            <select id="statusFilter" title="Filter credits by status" onchange="renderCredits()">
                <option value="all">All Outstanding</option>
                <option value="overdue">Overdue</option>
                <option value="today">Due Today</option>
                <option value="soon">Due Soon (≤ 7 days)</option>
                <option value="upcoming">Upcoming</option>
                <option value="nodue">No Due Date</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Receipt</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Sale Date</th>
                        <th class="num">Total</th>
                        <th class="num">Paid</th>
                        <th class="num">Balance</th>
                        <th>Due</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="creditsBody">
                    <tr><td colspan="9" class="loading-spinner">Loading credits...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- DETAIL PANEL -->
    <div class="credit-detail-overlay" id="detailOverlay">
        <div class="credit-detail-panel" id="detailPanel"></div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/env.js"></script>
    <script src="js/shared.js"></script>

    <script>
    // ============================================
    // STATE
    // ============================================
    let credits = [];
    let selectedCreditId = null;
    let recordPaymentMethod = 'Cash';

    // ============================================
    // HELPERS
    // ============================================
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    function fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function daysUntil(dueDate) {
        if (!dueDate) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate + 'T00:00:00');
        return Math.round((due - today) / 86400000);
    }

    function urgency(credit) {
        const d = daysUntil(credit.due_date);
        if (d === null) return 'nodue';
        if (d < 0) return 'overdue';
        if (d === 0) return 'today';
        if (d <= 7) return 'soon';
        return 'upcoming';
    }

    function daysBadge(credit) {
        const d = daysUntil(credit.due_date);
        if (d === null) return '<span class="days-badge paid">No due date</span>';
        if (d < 0) return `<span class="days-badge overdue">${Math.abs(d)}d overdue</span>`;
        if (d === 0) return `<span class="days-badge today">Due today</span>`;
        return `<span class="days-badge ${urgency(credit)}">${d}d left</span>`;
    }

    function balanceOf(c) {
        return Math.max(0, (Number(c.total) || 0) - (Number(c.paid_amount) || 0));
    }

    // ============================================
    // LOAD
    // ============================================
    async function loadCredits() {
        const tbody = document.getElementById('creditsBody');
        const errorArea = document.getElementById('errorArea');
        errorArea.innerHTML = '';
        tbody.innerHTML = '<tr><td colspan="9" class="loading-spinner">Loading credits...</td></tr>';

        try {
            const res = await apiRequest('/discounts/credit');
            credits = res.data || [];
            renderStats(res);
            renderCredits();
        } catch (err) {
            console.error('loadCredits failed:', err);
            tbody.innerHTML = '';
            errorArea.innerHTML = `
                <div class="error-banner">
                    <div>
                        <strong>Could not load credits.</strong><br>
                        <span style="font-size:13px;">${escapeHtml(err.message || 'Unknown error')}</span>
                    </div>
                    <button class="btn-ghost btn-sm" onclick="loadCredits()">Retry</button>
                </div>`;
        }
    }

    function renderStats(res) {
        const list = res.data || [];
        const totalOutstanding = list.reduce((s, c) => s + balanceOf(c), 0);
        const overdueList = list.filter(c => urgency(c) === 'overdue');
        const dueSoonList = list.filter(c => ['today', 'soon'].includes(urgency(c)));
        const overdueAmount = overdueList.reduce((s, c) => s + balanceOf(c), 0);

        document.getElementById('creditStats').innerHTML = createStats([
            ['Outstanding', formatCurrency(totalOutstanding), 'var(--red)'],
            ['Open Invoices', list.length, 'var(--accent)'],
            ['Overdue', overdueList.length, 'var(--red)'],
            ['Overdue Value', formatCurrency(overdueAmount), 'var(--red)'],
            ['Due Soon', dueSoonList.length, 'var(--yellow)']
        ]);
    }

    function renderCredits() {
        const q = (document.getElementById('creditSearch').value || '').trim().toLowerCase();
        const filter = document.getElementById('statusFilter').value;

        let list = credits.slice();
        if (q) {
            list = list.filter(c =>
                (c.customer_name || '').toLowerCase().includes(q) ||
                (c.customer_phone || '').toLowerCase().includes(q) ||
                (c.receipt_number || '').toLowerCase().includes(q)
            );
        }
        if (filter !== 'all') {
            list = list.filter(c => {
                const u = urgency(c);
                if (filter === 'overdue') return u === 'overdue';
                if (filter === 'today') return u === 'today';
                if (filter === 'soon') return u === 'soon' || u === 'today';
                if (filter === 'upcoming') return u === 'upcoming';
                if (filter === 'nodue') return u === 'nodue';
                return true;
            });
        }

        // Sort by due date ascending (most urgent first), then by created
        list.sort((a, b) => {
            if (a.due_date && b.due_date) return new Date(a.due_date) - new Date(b.due_date);
            if (a.due_date) return -1;
            if (b.due_date) return 1;
            return new Date(b.sale_date) - new Date(a.sale_date);
        });

        const tbody = document.getElementById('creditsBody');

        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="9" class="empty-state">${credits.length ? 'No credits match your filters.' : 'No outstanding credits. Nice!'}</td></tr>`;
            return;
        }

        tbody.innerHTML = list.map(c => {
            const u = urgency(c);
            const bal = balanceOf(c);
            return `
                <tr class="credit-row ${u}" onclick="openDetail('${c.id}')">
                    <td class="mono" style="font-size:12px;">${escapeHtml(c.receipt_number || '')}</td>
                    <td><strong>${escapeHtml(c.customer_name || 'Unknown')}</strong></td>
                    <td class="mono" style="font-size:12px;">${escapeHtml(c.customer_phone || '—')}</td>
                    <td class="muted" style="font-size:12px;">${fmtDate(c.sale_date)}</td>
                    <td class="mono num">${formatCurrency(c.total || 0)}</td>
                    <td class="mono num" style="color:var(--green);">${formatCurrency(c.paid_amount || 0)}</td>
                    <td class="mono num" style="color:var(--red);font-weight:600;">${formatCurrency(bal)}</td>
                    <td>${daysBadge(c)}</td>
                    <td><button class="btn-ghost btn-sm" onclick="event.stopPropagation();openDetail('${c.id}')">View</button></td>
                </tr>`;
        }).join('');
    }

    // ============================================
    // DETAIL PANEL
    // ============================================
    function openDetail(id) {
        selectedCreditId = id;
        recordPaymentMethod = 'Cash';
        renderDetail();
        document.getElementById('detailOverlay').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('open');
        selectedCreditId = null;
    }

    function renderDetail() {
        const c = credits.find(x => x.id === selectedCreditId);
        const panel = document.getElementById('detailPanel');
        if (!c) { closeDetail(); return; }

        const bal = balanceOf(c);
        const items = c.sale_items || [];
        const payments = c.credit_payments || [];

        const paymentHistory = payments.length
            ? payments.map(p => `
                <div class="payment-history-item">
                    <div class="phi-info">
                        <div>${escapeHtml(p.payment_method || 'Payment')}</div>
                        <div class="phi-date">${fmtDate(p.payment_date)}</div>
                    </div>
                    <div class="phi-amount">+ ${formatCurrency(p.amount || 0)}</div>
                </div>
            `).join('')
            : '<div class="empty-state" style="padding:16px;font-size:12px;">No payments recorded yet.</div>';

        panel.innerHTML = `
            <div class="cdp-header">
                <h3>${escapeHtml(c.receipt_number || 'Credit Sale')}</h3>
                <button class="close-x" onclick="closeDetail()">✕</button>
            </div>
            <div class="cdp-body">
                <div class="cdp-section">
                    <div class="cdp-section-label">Customer</div>
                    <div class="cdp-kv"><span>Name</span><span class="v">${escapeHtml(c.customer_name || 'Unknown')}</span></div>
                    <div class="cdp-kv"><span>Phone</span><span class="v">${escapeHtml(c.customer_phone || '—')}</span></div>
                    <div class="cdp-kv"><span>Sale Date</span><span class="v">${fmtDate(c.sale_date)}</span></div>
                    <div class="cdp-kv"><span>Due Date</span><span class="v">${c.due_date ? fmtDate(c.due_date) : '—'}</span></div>
                    <div class="cdp-kv"><span>Status</span><span class="v ${urgency(c) === 'overdue' ? 'red' : 'yellow'}">${escapeHtml((c.payment_status || '').toUpperCase())}</span></div>
                </div>

                <div class="cdp-section">
                    <div class="cdp-section-label">Items (${items.length})</div>
                    <div style="font-size:12px;">
                        ${items.map(it => `
                            <div class="cdp-kv">
                                <span>${escapeHtml(it.product_name || '')} × ${it.quantity}</span>
                                <span class="v">${formatCurrency(it.total_price || 0)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="cdp-section">
                    <div class="cdp-section-label">Totals</div>
                    <div class="cdp-kv"><span>Subtotal</span><span class="v">${formatCurrency(c.subtotal || 0)}</span></div>
                    ${c.discount ? `<div class="cdp-kv"><span>Discount</span><span class="v red">− ${formatCurrency(c.discount)}</span></div>` : ''}
                    <div class="cdp-kv total"><span>Total</span><span class="v">${formatCurrency(c.total || 0)}</span></div>
                    <div class="cdp-kv"><span>Paid</span><span class="v green">${formatCurrency(c.paid_amount || 0)}</span></div>
                    <div class="cdp-kv total"><span>Balance</span><span class="v red">${formatCurrency(bal)}</span></div>
                </div>

                <div class="cdp-section">
                    <div class="cdp-section-label">Payment History</div>
                    ${paymentHistory}
                </div>

                ${bal > 0 ? `
                    <div class="cdp-section">
                        <div class="cdp-section-label">Record Payment</div>
                        <div class="form-control" style="margin-bottom:10px;">
                            <label>Amount</label>
                            <input type="number" id="payAmount" min="1" max="${bal}" step="1" placeholder="0" />
                            <small style="color:var(--text-muted);font-size:11px;margin-top:4px;">Max: ${formatCurrency(bal)}</small>
                        </div>
                        <div class="payment-methods-mini">
                            <button class="payment-mini-btn active" data-pay="Cash" onclick="selectPayMethod(this)">💰 Cash</button>
                            <button class="payment-mini-btn" data-pay="M-Pesa" onclick="selectPayMethod(this)">📱 M-Pesa</button>
                            <button class="payment-mini-btn" data-pay="Bank" onclick="selectPayMethod(this)">🏦 Bank</button>
                            <button class="payment-mini-btn" data-pay="Credit" onclick="selectPayMethod(this)">📋 Other</button>
                        </div>
                        <div class="form-control">
                            <label>Notes (optional)</label>
                            <input type="text" id="payNotes" placeholder="e.g., partial payment received" />
                        </div>
                    </div>
                ` : ''}
            </div>
            ${bal > 0 ? `
                <div class="cdp-footer">
                    <button class="btn-ghost btn-sm" onclick="fillFullPayment()">Fill Full (${formatCurrency(bal)})</button>
                    <button class="btn-primary-solid btn-sm" onclick="submitPayment()">Record Payment</button>
                </div>
            ` : `
                <div class="cdp-footer">
                    <button class="btn-ghost btn-sm" style="flex:1;" onclick="closeDetail()">Close</button>
                </div>
            `}
        `;
    }

    function selectPayMethod(el) {
        recordPaymentMethod = el.dataset.pay;
        document.querySelectorAll('.payment-mini-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function fillFullPayment() {
        const c = credits.find(x => x.id === selectedCreditId);
        if (!c) return;
        document.getElementById('payAmount').value = balanceOf(c);
    }

    async function submitPayment() {
        const c = credits.find(x => x.id === selectedCreditId);
        if (!c) return;

        const amount = parseFloat(document.getElementById('payAmount').value);
        const bal = balanceOf(c);
        const notes = document.getElementById('payNotes').value.trim();

        if (isNaN(amount) || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
        if (amount > bal) { showToast('Amount exceeds balance', 'error'); return; }

        try {
            await apiRequest('/discounts/credit/pay', {
                method: 'POST',
                body: JSON.stringify({
                    sale_id: c.id,
                    amount: amount,
                    payment_method: recordPaymentMethod,
                    notes: notes || undefined
                })
            });
            showToast(`Payment of ${formatCurrency(amount)} recorded`, 'success');
            closeDetail();
            await loadCredits();
        } catch (err) {
            console.error('submitPayment failed:', err);
            showToast('Payment failed: ' + err.message, 'error');
        }
    }

    // ============================================
    // INIT
    // ============================================
    async function init() {
        if (!requireAuth()) return;
        await refreshCurrentUser();

        if (!hasPerm('sales.view_all')) {
            showToast('Access denied — you do not have permission to view credits', 'error');
            setTimeout(() => window.location.href = 'pos.html', 800);
            return;
        }

        if (window.CONFIG?.APP?.NAME) {
            const t = document.getElementById('appTitle');
            if (t) t.textContent = CONFIG.APP.NAME;
        }

        document.getElementById('tabAll').style.display       = hasPerm('sales.view_all')  ? '' : 'none';
        document.getElementById('tabCredits').style.display   = hasPerm('sales.view_all')  ? '' : 'none';
        document.getElementById('tabReports').style.display   = hasPerm('reports.view')    ? '' : 'none';
        document.getElementById('tabLive').style.display      = hasPerm('live.view')       ? '' : 'none';
        document.getElementById('tabAnalytics').style.display = hasPerm('analytics.view')  ? '' : 'none';
        document.getElementById('tabUsers').style.display     = hasPerm('users.view')      ? '' : 'none';

        updateUserChip();
        loadCredits();

        console.log('✅ Credits page ready');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
